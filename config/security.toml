[app]
bind_alarm_grader = "127.0.0.1:8780"
bind_safetyagent = "127.0.0.1:8088"
bind_face_db = "127.0.0.1:8087"
alarm_grader_url = "http://127.0.0.1:8780"
face_db_path = "data/face_db.sqlite"
scene_mode = "security-only"
model_path = "models/yolov8n.onnx"

[alarm]
history_len = 20
hysteresis_window = 5
thresholds = [0.30, 0.50, 0.80]
telegram_min_level = "medium"

[telegram]
enabled = false
bot_token_env = "TELEGRAM_BOT_TOKEN"
chat_id_env = "TELEGRAM_CHAT_ID"

[face_db]
auto_create = true

[vision]
tick_ms = 2500
default_camera_id = "ssc-cabled-ch1"
target_url = "http://127.0.0.1:8780/ingest"
# Real-feed mode: pull JPEG frames from the camera-adapter (host 127.0.0.1:8093
# -> container :8090). The adapter returns a JSON envelope with a
# data:image/jpeg;base64 `url`; vision_agent decodes it (see capture_and_analyze).
# Set VISION_ALLOW_SYNTHETIC=false in the service env to disable synthetic events.
# CAMERA_SNAPSHOT_URL / FASTVLM_URL env vars override these.
snapshot_url = "http://127.0.0.1:8093/api/snapshot/ssc-cabled-ch1"
# FastVLM /describe lives on :8091 (the :8092 snapshot service has no /describe).
# Requires FASTVLM_API_TOKEN in the service env (the /describe route is auth-gated).
fastvlm_url = "http://127.0.0.1:8091"

[fortress]
url = "http://localhost:7700"
mesh_enabled = true
publish_timeout_ms = 500
