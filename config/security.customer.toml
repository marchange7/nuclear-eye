[app]
# Containerized appliance: the alarm grader must bind 0.0.0.0 so the
# sentinelle-gateway (a separate container) can reach its /health for the
# fail-closed judgment probe. 127.0.0.1 makes the grader loopback-only →
# gateway judgment.ready=false → /health reports "degraded". Binding 0.0.0.0
# is safe here: the port is not published to the host, only reachable on the
# internal compose network.
bind_alarm_grader = "0.0.0.0:8780"
bind_safetyagent = "127.0.0.1:8081"
bind_face_db = "127.0.0.1:8087"
alarm_grader_url = "http://127.0.0.1:8780"
face_db_path = "data/face_db.sqlite"
scene_mode = "security-only"
model_path = "models/yolov8n.onnx"

[alarm]
history_len = 20
hysteresis_window = 5
thresholds = [0.30, 0.50, 0.80]
telegram_min_level = "medium"

[telegram]
enabled = false
bot_token_env = "TELEGRAM_BOT_TOKEN"
chat_id_env = "TELEGRAM_CHAT_ID"

[face_db]
auto_create = true

[vision]
tick_ms = 2500
default_camera_id = "front-door"
target_url = "http://127.0.0.1:8780/ingest"

[fortress]
url = "http://127.0.0.1:7700"
mesh_enabled = true
publish_timeout_ms = 500
