name: CI

on:
  push:
    branches: [main]
  pull_request:

# nuclear-eye has two layers:
#   - Python service (main.py, camera_server.py, face_embedding_service.py, perceive_service.py)
#   - Rust library + binaries (path deps on nuclear-sdk, nuclear-consul, etc.)
#
# Rust build requires all sibling repos — run `cargo test` on b450, not here.
# This workflow covers Python lint only. Integration tests run on b450.

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check .

      - name: ruff format check
        run: ruff format --check .

  python-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal runtime deps
        run: pip install fastapi uvicorn httpx pillow toml numpy

      - name: P4-7 gesture_pose mapping unit tests
        run: python -m unittest test_gesture_pose_mapping -v

      - name: Syntax check — importable without heavy deps
        run: |
          python -c "
          import ast, pathlib, sys
          errors = []
          for f in pathlib.Path('.').glob('**/*.py'):
              if '.git' in f.parts or 'target' in f.parts:
                  continue
              try:
                  ast.parse(f.read_text())
              except SyntaxError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              for e in errors: print(e)
              sys.exit(1)
          print(f'All .py files parse clean')
          "
        env:
          NUCLEAR_WRAPPER_URL: ""
          FASTVLM_DISABLED: "true"
          NUCLEAR_ENV: test

  # SE-7 (os/110 §7) — schema-hash drift gate.
  # Fails if src/alert/envelope.rs's `schema-hash:` header no longer matches
  # nuclear-sdk/schemas/sentinelle-alert.v1.json's sha256. Catches the
  # "developer edited the schema but didn't regen consumer artifacts"
  # failure mode that would otherwise silently ship a stale alert envelope.
  schema-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shallow-clone nuclear-sdk for canonical schema
        run: git clone --depth 1 https://github.com/marchange7/nuclear-sdk.git /tmp/nuclear-sdk

      - name: Verify sentinelle-alert Rust artifact in sync with canonical schema
        run: |
          set -euo pipefail
          ARTIFACT=src/alert/envelope.rs
          SCHEMA=/tmp/nuclear-sdk/schemas/sentinelle-alert.v1.json

          if [[ ! -f "$ARTIFACT" ]]; then
            echo "ERROR: artifact $ARTIFACT not found in checkout"
            exit 1
          fi

          canon=$(sha256sum "$SCHEMA" | awk '{print $1}')
          header=$(grep -m1 -E '^// schema-hash:' "$ARTIFACT" | awk '{print $3}')

          echo "  canonical: $canon"
          echo "  header:    $header"

          if [[ "$canon" != "$header" ]]; then
            echo ""
            echo "ERROR: schema-hash drift — $ARTIFACT is stale."
            echo "  expected: $canon (nuclear-sdk/schemas/sentinelle-alert.v1.json)"
            echo "  found:    $header (in artifact header)"
            echo ""
            echo "Regenerate: cd ../nuclear-sdk && bash scripts/gen-schema-types.sh"
            echo "Then copy the updated artifact to nuclear-eye/src/alert/ + commit."
            exit 1
          fi
          echo "  ✓ in sync"
